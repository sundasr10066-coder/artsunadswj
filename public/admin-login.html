
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ArtSphere</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="admin-login-page">

    <header class="navbar admin-login-navbar">
        <a class="brand-lockup" href="/"><img src="/logo.svg" alt=""><span>ArtSphere.</span></a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/login.html">User Login</a>
        </nav>
    </header>

    <main class="admin-login-main">
        <section class="admin-login-card">
            <span class="admin-login-eyebrow">SECURE ADMIN ACCESS</span>
            <h1>Admin Login</h1>
            <p class="admin-login-description">
                Welcome to the ArtSphere admin panel. Sign in to manage your website.
            </p>

            <form id="adminLoginForm" class="admin-login-form" action="/admin/login" method="POST">
                <label for="adminEmail">Admin Email</label>
                <input
                    id="adminEmail"
                    type="email"
                    name="email"
                    placeholder="Enter your admin email"
                    autocomplete="username"
                    required
                >

                <label for="adminPassword">Admin Password</label>
                <input
                    id="adminPassword"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="admin-login-submit" id="adminLoginButton">
                    Login as Admin
                </button>
                <p id="adminLoginMessage" class="admin-login-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script>
        const adminLoginForm = document.getElementById("adminLoginForm");
        const adminLoginButton = document.getElementById("adminLoginButton");
        const adminLoginMessage = document.getElementById("adminLoginMessage");

        adminLoginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            adminLoginButton.disabled = true;
            adminLoginMessage.textContent = "Signing in...";

            try {
                const response = await fetch("/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams(new FormData(adminLoginForm))
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    adminLoginMessage.textContent =
                        data.message || "Admin login failed.";
                    return;
                }

                window.location.replace(data.redirect || "/admin.html");
            } catch (error) {
                console.error("ADMIN LOGIN ERROR:", error);
                adminLoginMessage.textContent =
                    "Unable to sign in. Please check the server and try again.";
            } finally {
                adminLoginButton.disabled = false;
            }
        });
    </script>

</body>
</html>
